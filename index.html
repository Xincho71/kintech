<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINTECH | Elite Home</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg width='512' height='512' viewBox='0 0 512 512' fill='none' xmlns='http://www.w3.org/2000/svg'><rect width='512' height='512' rx='64' fill='black'/><path d='M256 64C256 64 160 80 160 160V320C160 400 256 448 256 448C256 448 352 400 352 320V160C352 80 256 64 256 64Z' stroke='%23C5A059' stroke-width='20'/><path d='M210 160V352M210 256L274 160M274 352L210 256H238L302 352M210 256H238L302 160' stroke='%23C5A059' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@100;300;400;700&display=swap');

        :root {
            --bg: #050505;
            --text: #ffffff;
            --gold: #c5a059;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        nav {
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-svg {
            width: 35px;
            height: 35px;
        }

        .brand-name {
            font-family: 'Playfair Display';
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 3px;
            color: var(--gold);
        }

        .cart-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
        }

        .hero {
            height: 45vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('image_ee887f.png');
            background-size: cover;
            background-position: center;
            text-align: center;
            margin-top: 59px;
        }

        .hero-content h1 {
            font-family: 'Playfair Display';
            font-size: 2.6rem;
            color: var(--gold);
            font-style: italic;
            margin: 0;
        }

        .filters {
            padding: 20px 5%;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            position: sticky;
            top: 59px;
            background: var(--bg);
            z-index: 900;
        }

        .f-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .f-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(197, 160, 89, 0.1);
        }

        .grid {
            display: grid;
            padding: 10px 5% 100px;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }

        .img-box {
            width: 100%;
            height: 210px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .img-box img {
            width: 112%;
            height: 112%;
            object-fit: cover;
            object-position: top;
        }

        .details {
            padding: 15px;
            text-align: center;
        }

        .details h3 {
            font-size: 0.85rem;
            margin: 0 0 8px;
            font-weight: 400;
            height: 40px;
            overflow: hidden;
        }

        .details .price {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.2rem;
        }

        #detailPage {
            position: fixed;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 2000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 40px 5%;
        }

        #detailPage.open {
            left: 0;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .qty-btn {
            background: var(--gold);
            color: #000;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }

        .cart-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 3000;
            transition: 0.3s;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .cart-panel.open {
            right: 0;
        }

        .action-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 18px;
            font-weight: 800;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .cart-panel {
                width: 420px;
                right: -420px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-left" onclick="closeProduct()">
            <svg class="logo-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="512" height="512" rx="64" fill="black" />
                <path
                    d="M256 64C256 64 160 80 160 160V320C160 400 256 448 256 448C256 448 352 400 352 320V160C352 80 256 64 256 64Z"
                    stroke="#C5A059" stroke-width="20" />
                <path d="M210 160V352M210 256L274 160M274 352L210 256H238L302 352M210 256H238L302 160" stroke="#C5A059"
                    stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="brand-name">KINTECH</span>
        </div>
        <button class="cart-btn" onclick="toggleCart()">კალათა (<span id="cartCount">0</span>)</button>
    </nav>

    <div id="mainContent">
        <header class="hero">
            <div class="hero-content">
                <span style="color:var(--gold); letter-spacing:5px; font-size:0.7rem; font-weight:700;">ESTABLISHED
                    2026</span>
                <h1>The Elite Home Collection</h1>
            </div>
        </header>

        <div class="filters">
            <button class="f-btn active" onclick="filter('All', event)">ყველა</button>
            <button class="f-btn" onclick="filter('უთოები', event)">უთოები</button>
            <button class="f-btn" onclick="filter('წვენსაწურები', event)">წვენსაწურები</button>
            <button class="f-btn" onclick="filter('თავის მოვლა', event)">თავის მოვლა</button>
        </div>

        <main class="grid" id="grid"></main>
    </div>

    <div id="detailPage">
        <button class="back-btn" onclick="closeProduct()">← უკან დაბრუნება</button>
        <div style="background:#fff; border-radius:15px; padding:20px; text-align:center; margin-bottom:25px;">
            <img id="dImg" style="max-width:100%; max-height:350px; object-fit:contain;" src="">
        </div>
        <h1 id="dTitle" style="font-family:'Playfair Display'; color:var(--gold); margin:0 0 10px;"></h1>
        <div id="dPrice" style="font-size:2rem; font-weight:700; color:var(--gold); margin-bottom:15px;"></div>
        <div id="dSpecs"
            style="opacity:0.8; line-height:1.8; font-size:1.1rem; border-bottom:1px solid var(--border); padding-bottom:20px;">
        </div>

        <div class="qty-box">
            <span style="font-weight:700;">რაოდენობა:</span>
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                <span id="qtyVal" style="font-size:1.4rem; font-weight:700; min-width:30px; text-align:center;">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
        </div>

        <button id="addBtn" class="action-btn">კალათაში დამატება</button>
    </div>

    <div class="cart-panel" id="cartPanel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2 style="font-family:'Playfair Display';">კალათა</h2>
            <span style="cursor:pointer; font-size:2.5rem; color:var(--gold);" onclick="toggleCart()">&times;</span>
        </div>
        <div id="cartItems" style="flex-grow:1; overflow-y:auto;"></div>
        <div style="padding-top:20px; border-top:1px solid var(--gold)">
            <div
                style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:700; font-size:1.3rem;">
                <span>ჯამი:</span><span id="totalPrice">0.00 ₾</span>
            </div>
            <button class="action-btn" onclick="checkoutWhatsApp()">შეკვეთის გაფორმება</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, cat: "უთოები", name: "Sokany ორთქლის უთო SK-11022", price: 19.98, img: "Screenshot 2026-04-17 234816.png", specs: "• 1800W სიმძლავრე<br>• კერამიკული ძირი<br>• თვითწმენდის ფუნქცია" },
            { id: 2, cat: "უთოები", name: "Sokany მშრალი უთო SK-11010", price: 16.67, img: "Screenshot 2026-04-17 235319.png", specs: "• 1500W სიმძლავრე<br>• კლასიკური დაუთოება" },
            { id: 3, cat: "წვენსაწურები", name: "Sokany პრემიუმ წვენსაწური JE-623D", price: 18.53, img: "Screenshot 2026-04-18 000534.png", specs: "• მეტალის კორპუსი<br>• ერგონომიული დიზაინი" },
            { id: 4, cat: "წვენსაწურები", name: "Sokany პროფესიონალი SK-190", price: 98.61, img: "Screenshot 2026-04-18 000651.png", specs: "• 1200W ძლიერი ძრავა<br>• 2 სიჩქარის რეჟიმი" },
            { id: 5, cat: "თავის მოვლა", name: "Sokany ფენი SK-2211 Pro", price: 10.47, img: "Screenshot 2026-04-18 001113.png", specs: "• 2400W სიმძლავრე<br>• 3 ტემპერატურის რეჟიმი" }
        ];

        let cart = [];
        let currentQty = 1;
        let selectedProductId = null;

        function render(cat) {
            const g = document.getElementById('grid');
            const data = cat === 'All' ? products : products.filter(p => p.cat === cat);
            g.innerHTML = data.map(p => `
                <div class="card" onclick="openProduct(${p.id})">
                    <div class="img-box"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/400?text=Sokany'"></div>
                    <div class="details">
                        <span style="font-size:0.6rem; color:var(--gold); font-weight:700; text-transform:uppercase;">${p.cat}</span>
                        <h3>${p.name}</h3>
                        <div class="price">${p.price.toFixed(2)} ₾</div>
                    </div>
                </div>
            `).join('');
        }

        function openProduct(id) {
            const p = products.find(x => x.id === id);
            selectedProductId = id;
            currentQty = 1;
            document.getElementById('qtyVal').innerText = currentQty;
            document.getElementById('dTitle').innerText = p.name;
            document.getElementById('dPrice').innerText = p.price.toFixed(2) + " ₾";
            document.getElementById('dSpecs').innerHTML = p.specs;
            document.getElementById('dImg').src = p.img;
            document.getElementById('addBtn').onclick = () => addToCart();
            document.getElementById('detailPage').classList.add('open');
            window.scrollTo(0, 0);
        }

        function changeQty(amt) {
            currentQty += amt;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('qtyVal').innerText = currentQty;
        }

        function closeProduct() { document.getElementById('detailPage').classList.remove('open'); }

        function addToCart() {
            const p = products.find(x => x.id === selectedProductId);
            // ვამოწმებთ, უკვე არის თუ არა კალათაში
            const existing = cart.find(item => item.id === p.id);
            if (existing) {
                existing.qty += currentQty;
            } else {
                cart.push({ ...p, qty: currentQty });
            }
            updateCartUI();
            toggleCart(true);
        }

        function updateCartUI() {
            const itemsDiv = document.getElementById('cartItems');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = totalItems;

            itemsDiv.innerHTML = cart.map((item, index) => `
                <div style="display:flex; gap:15px; margin-bottom:15px; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px;">
                    <img src="${item.img}" style="width:50px; height:50px; background:#fff; border-radius:6px; object-fit:contain;">
                    <div style="flex-grow:1">
                        <div style="font-size:0.85rem; font-weight:700;">${item.name}</div>
                        <div style="color:var(--gold); font-size:0.9rem;">${item.qty} x ${item.price.toFixed(2)} ₾</div>
                    </div>
                    <span style="color:#ff4444; cursor:pointer; font-size:1.5rem;" onclick="removeFromCart(${index})">&times;</span>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('totalPrice').innerText = total.toFixed(2) + " ₾";
        }

        function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }

        function toggleCart(open = null) {
            const panel = document.getElementById('cartPanel');
            if (open === true) panel.classList.add('open');
            else if (open === false) panel.classList.remove('open');
            else panel.classList.toggle('open');
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("კალათა ცარიელია!");
            let text = "გამარჯობა, მსურს შევიძინო:%0A";
            cart.forEach((item, i) => {
                text += `${i + 1}. ${item.name} - ${item.qty} ცალი (ჯამი: ${(item.price * item.qty).toFixed(2)} ₾)%0A`;
            });
            text += `%0A*საერთო ჯამი: ${document.getElementById('totalPrice').innerText}*`;
            window.open(`https://wa.me/995595431740?text=${text}`, '_blank');
        }

        function filter(c, e) {
            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render(c);
        }

        window.onload = () => render('All');
    </script>
</body>

</html>
