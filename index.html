<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINTECH | The Elite Home Collection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@100;300;400;700&display=swap');

        :root {
            --bg: #050505; --text: #ffffff; --gold: #c5a059;
            --card-bg: rgba(255,255,255,0.02); --border: rgba(255,255,255,0.08);
        }

        [data-theme="light"] {
            --bg: #fcfcfc; --text: #111111; --gold: #947436;
            --card-bg: #ffffff; --border: rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; transition: background 0.4s ease, color 0.4s ease; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* NAVIGATION */
        nav {
            padding: 10px 6%; display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(var(--bg), 0.7); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
        }
        .logo { font-family: 'Playfair Display'; font-weight: 700; font-size: 1.3rem; letter-spacing: 4px; color: var(--gold); cursor: pointer; }
        .cart-btn { background: var(--gold); color: #000; border: none; padding: 8px 16px; border-radius: 30px; font-size: 0.7rem; font-weight: 800; cursor: pointer; }

        /* HERO SECTION */
        .hero { height: 45vh; display: flex; align-items: center; justify-content: center; background: #000; text-align: center; padding: 20px; }
        .hero-content span { color: var(--gold); letter-spacing: 6px; font-size: 0.6rem; font-weight: 700; display: block; margin-bottom: 10px; }
        .hero-content h1 { font-family: 'Playfair Display'; font-size: 3rem; color: var(--gold); font-style: italic; margin: 0; font-weight: 100; }

        /* FILTERS */
        .filters { padding: 15px 6%; display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; position: sticky; top: 55px; background: var(--bg); z-index: 900; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .f-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 8px 20px; border-radius: 50px; font-size: 0.7rem; cursor: pointer; opacity: 0.7; }
        .f-btn.active { border-color: var(--gold); color: var(--gold); opacity: 1; background: rgba(197, 160, 89, 0.05); }

        /* GRID */
        .grid { display: grid; padding: 20px 6% 100px; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: pointer; }
        .img-box { width: 100%; height: 200px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .details { padding: 15px; text-align: center; }
        .details h3 { font-size: 0.8rem; margin: 8px 0; font-weight: 400; height: 38px; overflow: hidden; color: var(--text); opacity: 0.9; }
        .details .price { color: var(--gold); font-weight: 700; font-size: 1.1rem; }

        /* PRODUCT PAGE */
        #detailPage {
            position: fixed; top: 0; left: 100%; width: 100%; height: 100%;
            background: var(--bg); z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto; padding: 80px 6% 50px;
        }
        #detailPage.open { left: 0; }
        .back-btn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 20px; border-radius: 30px; cursor: pointer; margin-bottom: 25px; font-size: 0.7rem; font-weight: 700; }
        .detail-container { display: flex; flex-direction: column; gap: 30px; }
        .detail-img-box { background: #fff; border-radius: 12px; padding: 30px; display: flex; align-items: center; justify-content: center; min-height: 350px; }
        .detail-info h1 { font-family: 'Playfair Display'; font-size: 2rem; color: var(--gold); margin: 0 0 15px; }
        .detail-price { font-size: 2.2rem; font-weight: 700; margin-bottom: 25px; }
        .detail-specs { font-size: 0.9rem; line-height: 1.8; opacity: 0.8; border-top: 1px solid var(--border); padding-top: 20px; margin-bottom: 30px; }

        /* CART PANEL */
        .cart-panel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%; 
            background: var(--bg); z-index: 3000; transition: 0.3s; padding: 40px;
            display: flex; flex-direction: column; border-left: 1px solid var(--border);
        }
        .cart-panel.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .action-btn { background: var(--gold); color: #000; border: none; padding: 16px; font-weight: 800; cursor: pointer; width: 100%; border-radius: 4px; font-size: 0.8rem; letter-spacing: 1px; }

        /* DESKTOP VIEW */
        @media (min-width: 900px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
            .hero-content h1 { font-size: 4.5rem; }
            .detail-container { flex-direction: row; gap: 60px; align-items: start; }
            .detail-img-box { flex: 1; min-height: 500px; }
            .detail-info { flex: 1; }
            .cart-panel { width: 400px; right: -400px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="closeProduct()">KINTECH</div>
        <button class="cart-btn" onclick="toggleCart()">კალათა (<span id="cartCount">0</span>)</button>
    </nav>

    <div id="mainContent">
        <header class="hero">
            <div class="hero-content">
                <span>ESTABLISHED 2026</span>
                <h1>The Elite Home Collection</h1>
            </div>
        </header>

        <div class="filters">
            <button class="f-btn active" onclick="filter('All', event)">ყველა</button>
            <button class="f-btn" onclick="filter('Irons', event)">უთოები</button>
            <button class="f-btn" onclick="filter('Juicers', event)">წვენსაწურები</button>
            <button class="f-btn" onclick="filter('Personal', event)">თავის მოვლა</button>
        </div>

        <main class="grid" id="grid"></main>
    </div>

    <div id="detailPage">
        <button class="back-btn" onclick="closeProduct()">← უკან დაბრუნება</button>
        <div class="detail-container">
            <div class="detail-img-box"><img id="dImg" style="max-width:100%; max-height:450px;" src=""></div>
            <div class="detail-info">
                <span id="dCat" style="color:var(--gold); font-weight:700; letter-spacing:2px; font-size:0.7rem; display:block; margin-bottom:10px;"></span>
                <h1 id="dTitle"></h1>
                <div class="detail-price" id="dPrice"></div>
                <div class="detail-specs" id="dSpecs"></div>
                <button id="addBtn" class="action-btn">კალათაში დამატება</button>
                <a href="#" id="waLink" target="_blank" style="display:block; text-align:center; margin-top:15px; color:var(--gold); text-decoration:none; font-size:0.7rem; font-weight:700; border: 1px solid var(--gold); padding: 12px; border-radius:4px;">ORDER VIA WHATSAPP</a>
            </div>
        </div>
    </div>

    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h2 style="font-family: 'Playfair Display'; margin: 0;">თქვენი კალათა</h2>
            <span style="cursor:pointer; color:var(--gold); font-size: 2rem;" onclick="toggleCart()">&times;</span>
        </div>
        <div id="cartItems" style="flex-grow:1; overflow-y:auto;"></div>
        <div style="margin-top: 20px; border-top: 1px solid var(--gold); padding-top: 20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 20px; font-weight: 700;">
                <span>ჯამი:</span><span id="totalPrice">0.00 ₾</span>
            </div>
            <button class="action-btn" onclick="checkoutWhatsApp()">შეკვეთის გაფორმება</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, cat: "Irons", name: "Sokany SK-11022 Steam Iron", price: 19.98, img: "Screenshot 2026-04-17 234816.png", specs: "• 1800W სიმძლავრე<br>• კერამიკული ძირი<br>• თვითწმენდის ფუნქცია" },
            { id: 2, cat: "Irons", name: "Sokany SK-11010 Dry Iron", price: 16.67, img: "Screenshot 2026-04-17 235319.png", specs: "• 1500W სიმძლავრე<br>• ტემპერატურის კონტროლი<br>• გამძლე კორპუსი" },
            { id: 5, cat: "Juicers", name: "Sokany JE-623D Premium", price: 18.53, img: "Screenshot 2026-04-18 000534.png", specs: "• მეტალის კორპუსი<br>• 0.5L მოცულობა<br>• ერგონომიული დიზაინი" },
            { id: 6, cat: "Juicers", name: "Sokany SK-190 Juice Extractor", price: 98.61, img: "Screenshot 2026-04-18 000651.png", specs: "• 1200W პროფესიონალური ძრავა<br>• 2 სიჩქარის რეჟიმი" },
            { id: 9, cat: "Personal", name: "Sokany SK-2211 Pro Hair Dryer", price: 10.47, img: "Screenshot 2026-04-18 001113.png", specs: "• 2400W სიმძლავრე<br>• იონური დაცვა<br>• 3 რეჟიმი" }
        ];

        let cart = [];

        function render(cat) {
            const g = document.getElementById('grid');
            const data = cat === 'All' ? products : products.filter(p => p.cat === cat);
            g.innerHTML = data.map(p => `
                <div class="card" onclick="openProduct(${p.id})">
                    <div class="img-box"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/200'"></div>
                    <div class="details">
                        <span style="font-size:0.55rem; color:var(--gold); font-weight:700; text-transform:uppercase;">${p.cat}</span>
                        <h3>${p.name}</h3>
                        <div class="price">${p.price.toFixed(2)} ₾</div>
                    </div>
                </div>
            `).join('');
        }

        function openProduct(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('dTitle').innerText = p.name;
            document.getElementById('dPrice').innerText = p.price.toFixed(2) + " ₾";
            document.getElementById('dSpecs').innerHTML = p.specs;
            document.getElementById('dImg').src = p.img;
            document.getElementById('dCat').innerText = p.cat;
            document.getElementById('waLink').href = `https://wa.me/995595431740?text=გამარჯობა, მაინტერესებს: ${p.name}`;
            document.getElementById('addBtn').onclick = () => addToCart(p.id);
            document.getElementById('detailPage').classList.add('open');
            window.scrollTo(0,0);
        }

        function closeProduct() { document.getElementById('detailPage').classList.remove('open'); }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            cart.push(p);
            updateCartUI();
            toggleCart(true);
        }

        function updateCartUI() {
            const itemsDiv = document.getElementById('cartItems');
            document.getElementById('cartCount').innerText = cart.length;
            itemsDiv.innerHTML = cart.map((item, index) => `
                <div style="display:flex; gap:15px; margin-bottom:20px; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px;">
                    <img src="${item.img}" style="width:50px; height:50px; background:#fff; border-radius:4px; object-fit:contain;">
                    <div style="flex-grow:1">
                        <div style="font-size:0.75rem; font-weight:700;">${item.name}</div>
                        <div style="color:var(--gold); font-size:0.85rem;">${item.price.toFixed(2)} ₾</div>
                    </div>
                    <span style="cursor:pointer; color:#ff4d4d; font-weight:bold; font-size:1.2rem;" onclick="removeFromCart(${index})">&times;</span>
                </div>
            `).join('');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('totalPrice').innerText = total.toFixed(2) + " ₾";
        }

        function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }

        function toggleCart(open = null) {
            const panel = document.getElementById('cartPanel');
            if (open === true) panel.classList.add('open');
            else panel.classList.toggle('open');
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert("კალათა ცარიელია!");
            let text = "გამარჯობა, მსურს შევიძინო:%0A";
            cart.forEach((item, i) => { text += `${i+1}. ${item.name} - ${item.price.toFixed(2)} ₾%0A`; });
            text += `%0A*ჯამური ღირებულება: ${document.getElementById('totalPrice').innerText}*`;
            window.open(`https://wa.me/995595431740?text=${text}`, '_blank');
        }

        function filter(c, e) {        
            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render(c);
        }

        window.onload = () => render('All');
    </script>
</body>
</html>
